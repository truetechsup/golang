name: Go Tests

on:
  repository_dispatch:
    types: [run-tests]

jobs:
  run-tests:
    name: Run Go tests
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version-file: go.mod

    - name: Install latest Test IT adapter
      run: |
        go get github.com/testit-tms/adapters-go/v2@latest
        go list -m github.com/testit-tms/adapters-go/v2

    - name: Get data from webhook
      run: |
        echo "ADAPTER_MODE=${{ github.event.client_payload.adapter_mode }}" >> $GITHUB_ENV
        echo "TMS_URL=${{ github.event.client_payload.url }}" >> $GITHUB_ENV
        echo "TEST_RUN_ID=${{ github.event.client_payload.test_run_id }}" >> $GITHUB_ENV
        echo "PROJECT_ID=${{ github.event.client_payload.project_id }}" >> $GITHUB_ENV
        echo "CONFIGURATION_IDS=${{ github.event.client_payload.configuration_id[0] }}" >> $GITHUB_ENV

    - name: Download sync-storage
      run: |
        mkdir -p .caches
        # Получаем JSON последнего релиза
        RELEASE_JSON=$(curl -s "https://api.github.com/repos/testit-tms/sync-storage-public/releases/latest")
        LATEST_VERSION=$(echo "$RELEASE_JSON" | grep '"tag_name":' | sed -E 's/.*"([^"]+)".*/\1/')
        if [ -z "$LATEST_VERSION" ]; then
          echo "Failed to get latest version"
          exit 1
        fi
        echo "Latest sync-storage version: $LATEST_VERSION"
        # Ищем актив для linux_amd64
        DOWNLOAD_URL=$(echo "$RELEASE_JSON" | grep -o '"browser_download_url": "[^"]*linux_amd64"' | sed -E 's/.*"([^"]+)".*/\1/')
        if [ -z "$DOWNLOAD_URL" ]; then
          echo "Could not find linux_amd64 binary in release"
          exit 1
        fi
        curl -L -o .caches/syncstorage-linux-amd64 "$DOWNLOAD_URL"
        chmod +x .caches/syncstorage-linux-amd64
        # Проверка, что скачан реальный исполняемый файл
        file .caches/syncstorage-linux-amd64 | grep -q "ELF.*executable" || { echo "Downloaded file is not an executable"; cat .caches/syncstorage-linux-amd64 | head -c 200; exit 1; }

    - name: Start sync-storage
      run: |
        # Ждать до 600 с, пока не применятся все результаты, включая удерживаемый «в процессе»
        export TMS_SYNC_STORAGE_AUTOCOMPLETE_FALLBACK_S=600
        # adapterMode=0 — прогон из вебхука; adapterMode=2 — прогон создаёт адаптер и сам регистрирует его в sync-storage
        TEST_RUN_ARGS=()
        if [ "${{ env.ADAPTER_MODE }}" == "0" ]; then
          TEST_RUN_ARGS+=(--testRunId "${{ env.TEST_RUN_ID }}")
        fi
        nohup .caches/syncstorage-linux-amd64 \
          "${TEST_RUN_ARGS[@]}" \
          --port 49152 \
          --baseURL ${{ env.TMS_URL }} \
          --privateToken ${{ secrets.TMS_PRIVATE_TOKEN }} \
          > service.log 2>&1 &
        echo $! > syncstorage.pid
        sleep 3
        curl -sf http://127.0.0.1:49152/health || { echo "sync-storage did not start"; cat service.log; exit 1; }

    - name: Run tests
      env:
        TMS_URL: ${{ env.TMS_URL }}
        TMS_PRIVATE_TOKEN: ${{ secrets.TMS_PRIVATE_TOKEN }}
        TMS_PROJECT_ID: ${{ env.PROJECT_ID }}
        TMS_CONFIGURATION_ID: ${{ env.CONFIGURATION_IDS }}
        TMS_ADAPTER_MODE: ${{ env.ADAPTER_MODE }}
        TMS_TEST_RUN_NAME: "GitHub Actions #${{ github.run_number }} (adapterMode=${{ env.ADAPTER_MODE }})"
        TMS_TEST_RUN_LINKS: '[{"url":"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}","title":"GitHub Actions pipeline","type":"Related"}]'
        TMS_CERT_VALIDATION: "false"
        TMS_IMPORT_REALTIME: "true"
      run: |
        # adapterMode=0 — результаты пишутся в существующий прогон из вебхука
        # adapterMode=2 — адаптер сам создаёт новый прогон, testRunId не передаём
        export TMS_SYNC_STORAGE_PORT=49152
        if [ "$TMS_ADAPTER_MODE" == "0" ]; then
          export TMS_TEST_RUN_ID="${{ env.TEST_RUN_ID }}"
        fi
        cd examples
        # Адаптер требует tms.config.json в текущей папке; все значения берутся из переменных TMS_*
        echo '{}' > tms.config.json
        go test -v ./...

    - name: Wait for sync-storage completion
      if: always()
      run: |
        # Дожидаемся применения всех результатов и только после этого останавливаем sync-storage
        if [ "${{ env.ADAPTER_MODE }}" == "0" ]; then
          curl -v --max-time 660 "http://127.0.0.1:49152/wait-completion?testRunId=${{ env.TEST_RUN_ID }}" || true
        else
          curl -v --max-time 660 "http://127.0.0.1:49152/wait-completion" || true
        fi
        if [ -f syncstorage.pid ]; then
          kill $(cat syncstorage.pid) || true
        fi

    - name: Upload sync-storage log
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: syncstorage-log
        path: service.log
        retention-days: 1
        if-no-files-found: ignore
